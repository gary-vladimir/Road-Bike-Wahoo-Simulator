name: bikesim
services:
  bikesim:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    working_dir: /workspace
    command: sleep infinity
    ports:
      - '127.0.0.1:5186:5173'
    volumes:
      - ..:/workspace
      - bikesim_modules:/workspace/node_modules
      - bikesim_browser_cache:/root/.cache/ms-playwright
volumes:
  bikesim_modules:
  bikesim_browser_cache:
